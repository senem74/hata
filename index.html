<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16203a">
<title>Hata ve Net Defteri · SKB Akademi</title>
<style>
html,body{margin:0;height:100%;background:#faf7f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#16203a}
.y{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box}
.y b{font-size:13px;letter-spacing:2px;color:#c8102e}.y h1{margin:0;font-size:24px}
.s{width:34px;height:34px;border:4px solid #e7e1d3;border-top-color:#c8102e;border-radius:50%;animation:d 0.9s linear infinite}
@keyframes d{to{transform:rotate(360deg)}}
.e{display:none;max-width:320px;font-size:15px;line-height:1.5}.e button{margin-top:10px;background:#c8102e;color:#fff;border:0;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div class="y" id="y"><b>SKB AKADEMİ</b><h1>Hata ve Net Defteri</h1><div class="s" id="s"></div>
<div class="e" id="e">Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.<br><button onclick="location.reload()">Tekrar dene</button></div></div>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbysSYMJsEdg-NG7riZoeQYtXw9OoW2vhY6vcYD_YzkrFzgqB3GHiv5YUPJymTki0RlHsA/exec';
  var params = {};
  new URLSearchParams(location.search).forEach(function (v, k) { params[k] = v; });
  var demo = !!params.demo;

  function post(o) {
    return fetch(EXEC, { method: 'POST', body: JSON.stringify(o), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  // google.script.run ve google.script.url yerine geçen köprü
  function runner() {
    var ok = function () {}, bad = function () {};
    var p = new Proxy({}, { get: function (t, ad) {
      if (ad === 'withSuccessHandler') return function (f) { ok = f; return p; };
      if (ad === 'withFailureHandler') return function (f) { bad = f; return p; };
      if (ad === 'withUserObject') return function () { return p; };
      return function () {
        var a = arguments;
        if (ad !== 'api') { setTimeout(function () { bad(new Error('Desteklenmeyen işlem')); }); return; }
        post({ islem: a[0], veri: a[1] || {} }).then(function (r) { ok(r); }, function (e) { bad(e); });
      };
    } });
    return p;
  }
  var G = { script: {
    url: { getLocation: function (cb) { cb({ parameter: params, parameters: {}, hash: '' }); } },
    host: { close: function () {}, setHeight: function () {}, setWidth: function () {} }
  } };
  Object.defineProperty(G.script, 'run', { get: runner });

  function goster(html) {
    if (!demo) {
      window.google = G;
      html = html.replace(/<base target="_top">/i, '');
    }
    if (!/<title>/i.test(html)) html = html.replace(/<\/head>/i, '<title>Hata ve Net Defteri · SKB Akademi</title><meta name="theme-color" content="#16203a"></head>');
    document.open(); document.write(html); document.close();
  }

  function hata() { document.getElementById('s').style.display = 'none'; document.getElementById('e').style.display = 'block'; }

  post({ sayfa: demo ? 'Demo' : 'Index' })
    .then(function (r) { if (r && r.ok && r.html) goster(r.html); else hata(); })
    .catch(hata);
})();
</script>
</body>
</html>
